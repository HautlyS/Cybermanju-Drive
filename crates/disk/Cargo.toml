[package]
name = "cybermanju-disk"
version = "0.1.0"
edition = "2021"
description = ".cybermanju virtual disks: superblock, block allocator, volume merge, mount"

[dependencies]
anyhow = "1"
blake3 = "1"
cybermanju-compression = { path = "../compression" }
cybermanju-crypto = { path = "../crypto" }
cybermanju-db = { path = "../db" }
cybermanju-sync = { path = "../sync" }
cybermanju-types = { path = "../types" }
log = "0.4"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
