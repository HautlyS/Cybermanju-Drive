[package]
name = "cybermanju-sync"
version = "0.1.0"
edition = "2021"
description = "Storage sync backends (local, GitHub, GitLab, Google Drive, Google Photos, Telegram)"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cybermanju-compression = { path = "../compression" }
cybermanju-db = { path = "../db" }
cybermanju-types = { path = "../types" }
image = "0.25"
log = "0.4"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# <<< AGENT-3 OAUTH >>>
cybermanju-crypto = { path = "../crypto" }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
# <<< AGENT-1 TRANSFER: BLAKE3 integrity verification >>>
blake3 = "1"
